services:
  - type: web
    name: farm-city-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TON_WALLET_MNEMONIC
        sync: false
      - key: TON_WALLET_VERSION
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: PAYOUT_CRON_SECRET
        sync: false
      - key: WEBAPP_URL
        sync: false
